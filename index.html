<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falak Astronomi INSTUN</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    
    <!-- Memuatkan pustaka ikon FontAwesome -->
    <link rel="stylesheet" href="https://cloudflare.com">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            color: #fff;
        }

        /* Video AR Latar Belakang */
        #webcam-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            display: none; /* Ditutup secara lalai */
        }

        /* Antaramuka Pengguna (UI Overlay) */
        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            background: rgba(0, 0, 0, 0.4);
        }

        header {
            text-align: center;
            backdrop-filter: blur(5px);
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 1.4rem;
            letter-spacing: 1px;
            color: #ffd700;
        }

        /* Reka Bentuk Kompas */
        .compass-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .compass {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #ffd700;
            background: rgba(0, 0, 0, 0.7);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            position: relative;
            transition: transform 0.1s ease-out;
        }

        /* Penunjuk Arah Mata Angin */
        .rose {
            position: absolute;
            width: 100%;
            height: 100%;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .direction {
            position: absolute;
            width: 30px;
            text-align: center;
        }

        .dir-n { top: 10px; left: calc(50% - 15px); color: #ff4d4d; }
        .dir-e { right: 10px; top: calc(50% - 12px); color: #fff; }
        .dir-s { bottom: 10px; left: calc(50% - 15px); color: #fff; }
        .dir-w { left: 10px; top: calc(50% - 12px); color: #fff; }

        /* Jarum Kiblat */
        .qibla-arrow {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 40px solid #00ffcc;
            top: 20px;
            left: calc(50% - 15px);
            filter: drop-shadow(0 0 8px #00ffcc);
            display: none; /* Muncul selepas lokasi diperoleh */
        }

        /* Ikon Kaabah di Tengah */
        .kaaba-center {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #ffd700;
            color: #000;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            z-index: 3;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* Ruangan Info Status */
        .info-panel {
            background: rgba(0, 0, 0, 0.75);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-size: 0.9rem;
            max-width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Butang Kawalan */
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        button {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        button.btn-ar-active {
            background: #ff4d4d;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Elemen Kamera AR -->
    <video id="webcam-video" autoplay playsinline muted></video>

    <!-- UI Overlay -->
    <div class="ui-container">
        <header>
            <h1>Falak Astronomi INSTUN</h1>
            <p style="font-size: 0.8rem; color: #aaa;">Kompas Kiblat AR PWA</p>
        </header>

        <!-- Kompas -->
        <div class="compass-wrapper">
            <div class="kaaba-center">
                <i class="fa-solid fa-kaaba"></i>
            </div>
            <div class="compass" id="compassRing">
                <div class="rose">
                    <div class="direction dir-n">U</div>
                    <div class="direction dir-e">T</div>
                    <div class="direction dir-s">S</div>
                    <div class="direction dir-w">B</div>
                </div>
                <div class="qibla-arrow" id="qiblaArrow"></div>
            </div>
        </div>

        <!-- Panel Maklumat & Butang -->
        <div class="info-panel">
            <p id="status-text"><i class="fa-solid fa-spinner fa-spin"></i> Mengesan lokasi anda...</p>
            <p id="angle-text" style="margin-top: 5px; color: #00ffcc; font-weight: bold;"></p>
            
            <div class="controls">
                <button id="btn-location" onclick="getLocation()"><i class="fa-solid fa-location-crosshairs"></i> Reset Lokasi</button>
                <button id="btn-ar" onclick="toggleAR()"><i class="fa-solid fa-camera"></i> Aktif AR</button>
            </div>
        </div>
    </div>

    <script>
        // Koordinat Kaabah (Makkah)
        const KAABA_LAT = 21.4225;
        const KAABA_LNG = 39.8262;

        let userLat = null;
        let userLng = null;
        let qiblaAngle = null;
        let currentHeading = 0;
        let isARActive = false;
        let videoStream = null;

        const compassRing = document.getElementById('compassRing');
        const qiblaArrow = document.getElementById('qiblaArrow');
        const statusText = document.getElementById('status-text');
        const angleText = document.getElementById('angle-text');
        const btnAR = document.getElementById('btn-ar');
        const videoElement = document.getElementById('webcam-video');

        // 1. Pengiraan Arah Kiblat (Formula Great Circle Distance)
        function calculateQibla(lat, lng) {
            const phiK = KAABA_LAT * Math.PI / 180;
            const lambdaK = KAABA_LNG * Math.PI / 180;
            const phiU = lat * Math.PI / 180;
            const lambdaU = lng * Math.PI / 180;

            const deltaLambda = lambdaK - lambdaU;

            const y = Math.sin(deltaLambda);
            const x = Math.cos(phiU) * Math.tan(phiK) - Math.sin(phiU) * Math.cos(deltaLambda);
            
            let qibla = Math.atan2(y, x) * 180 / Math.PI;
            qibla = (qibla + 360) % 360;
            return qibla;
        }

        // 2. Mendapatkan Lokasi Pengguna
        function getLocation() {
            if (!navigator.geolocation) {
                statusText.innerHTML = "Geolokasi tidak disokong oleh pelayar anda.";
                return;
            }
            statusText.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Mengesan GPS...`;
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;
                    qiblaAngle = calculateQibla(userLat, userLng);
                    
                    statusText.innerHTML = `<i class="fa-solid fa-circle-check" style="color:#00ffcc"></i> Lokasi dikesan berdekatan.`;
                    angleText.innerHTML = `Sudut Kiblat: ${qiblaAngle.toFixed(2)}° dari Utara`;
                    
                    // Paparkan jarum kiblat pada kompas
                    qiblaArrow.style.display = 'block';
                    qiblaArrow.style.transform = `rotate(${qiblaAngle}deg)`;
                    
                    initCompass();
                },
                (error) => {
                    statusText.innerHTML = `<i class="fa-solid fa-triangle-exclamation" style="color:#ff4d4d"></i> Gagal akses GPS. Sila benarkan lokasi.`;
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // 3. Sensor Kompas (Orientasi Peranti)
        function initCompass() {
            if (window.DeviceOrientationEvent) {
                // Untuk peranti iOS (iPhone) yang memerlukan kebenaran khas
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(permissionState => {
                            if (permissionState === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation, true);
                            } else {
                                statusText.innerHTML = "Kebenaran kompas ditolak.";
                            }
                        })
                        .catch(console.error);
                } else {
                    // Peranti Android / Pelayar biasa
                    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                    // Sandaran jika jenis absolute tidak disokong
                    window.addEventListener('deviceorientation', handleOrientation, true);
                }
            } else {
                statusText.innerHTML = "Sensor orientasi tidak disokong peranti ini.";
            }
        }

        function handleOrientation(event) {
            // Mengambil data heading berdasarkan sistem operasi peranti
            if (event.webkitCompassHeading) {
                currentHeading = event.webkitCompassHeading; // iOS
            } else if (event.alpha) {
                currentHeading = 360 - event.alpha; // Android (Kiraan arah berbalik)
                if(event.absolute === false) {
                   // Amaran jika kompas kurang tepat tanpa mod absolute
                   angleText.innerHTML = `Sudut Kiblat: ${qiblaAngle.toFixed(2)}° <br><span style="font-size:0.7rem;color:#ff4d4d;">(Gerakkan peranti membentuk angka 8 untuk kalibrasi)</span>`;
                }
            }

            // Memusingkan piring kompas mengikut arah peranti dipusing
            compassRing.style.transform = `rotate(${-currentHeading}deg)`;
        }

        // 4. Fungsi Aktif / Nyahaktif Video AR Kamera
        async function toggleAR() {
            if (!isARActive) {
                // Aktifkan Kamera
                try {
                    const constraints = {
                        video: { facingMode: { exact: "environment" } }, // Guna kamera belakang
                        audio: false
                    };
                    videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                    videoElement.srcObject = videoStream;
                    videoElement.style.display = 'block';
                    
                    btnAR.innerHTML = `<i class="fa-solid fa-camera-roated"></i> Tutup AR`;
                    btnAR.classList.add('btn-ar-active');
                    isARActive = true;
                } catch (err) {
                    // Cuba kamera biasa jika kamera belakang (exact environment) tiada/gagal
                    try {
                        videoStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                        videoElement.srcObject = videoStream;
                        videoElement.style.display = 'block';
                        btnAR.innerHTML = `<i class="fa-solid fa-camera-retro"></i> Tutup AR`;
                        btnAR.classList.add('btn-ar-active');
                        isARActive = true;
                    } catch (e) {
                        alert("Gagal mengakses kamera peranti untuk fungsi AR: " + e.message);
                    }
                }
            } else {
                // Nyahaktifkan Kamera
                if (videoStream) {
                    videoStream.getTracks().forEach(track => track.stop());
                }
                videoElement.style.display = 'none';
                btnAR.innerHTML = `<i class="fa-solid fa-camera"></i> Aktif AR`;
                btnAR.classList.remove('btn-ar-active');
                isARActive = false;
            }
        }

        // Jalankan pengesanan lokasi sebaik sahaja aplikasi dibuka
        window.onload = () => {
            getLocation();
            
            // Pendaftaran Service Worker untuk keupayaan PWA
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js')
                .then(() => console.log("Service Worker Berjaya Didaftarkan"))
                .catch(err => console.log("Gagal daftar Service Worker", err));
            }
        };
    </script>
</body>
</html>
