<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falak Astronomi INSTUN</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    
    <link rel="stylesheet" href="https://cloudflare.com">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            color: #fff;
        }

        #webcam-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            display: none;
        }

        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 25px 20px;
            background: rgba(0, 0, 0, 0.3);
        }

        header {
            text-align: center;
            backdrop-filter: blur(10px);
            background: rgba(0, 0, 0, 0.65);
            padding: 12px 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        h1 {
            font-size: 1.3rem;
            color: #ffd700;
        }

        /* Kompas Luaran */
        .compass-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .compass {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #ffd700;
            background: rgba(10, 10, 10, 0.85);
            box-shadow: 0 0 25px rgba(215, 175, 0, 0.3);
            position: relative;
            /* Dibuat linear lancar melalui JS */
            transition: transform 0.1s linear; 
        }

        /* Senggatan & Angka Darjah */
        .ticks-container {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .tick {
            position: absolute;
            width: 2px;
            height: 8px;
            background: rgba(255, 255, 255, 0.4);
            left: calc(50% - 1px);
            top: 0;
            transform-origin: 1px 150px;
        }

        .tick.major {
            height: 14px;
            background: #ffd700;
            width: 2px;
        }

        .tick-label {
            position: absolute;
            width: 30px;
            text-align: center;
            font-size: 0.65rem;
            color: #ccc;
            left: calc(50% - 15px);
            top: 16px;
            transform-origin: 15px 134px;
        }

        /* Mata Angin Utama */
        .rose {
            position: absolute;
            width: 100%;
            height: 100%;
            font-weight: bold;
            font-size: 1.2rem;
            z-index: 2;
        }

        .direction {
            position: absolute;
            width: 30px;
            text-align: center;
        }
        .dir-n { top: 32px; left: calc(50% - 15px); color: #ff4d4d; font-size: 1.3rem;}
        .dir-e { right: 32px; top: calc(50% - 12px); color: #fff; }
        .dir-s { bottom: 32px; left: calc(50% - 15px); color: #fff; }
        .dir-w { left: 32px; top: calc(50% - 12px); color: #fff; }

        /* Jarum Penunjuk Kiblat Tradisional */
        .qibla-arrow {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 45px solid #00ffcc;
            top: 40px;
            left: calc(50% - 12px);
            filter: drop-shadow(0 0 6px #00ffcc);
            transform-origin: 12px 110px;
            display: none;
            z-index: 3;
        }

        /* Ikon Kaabah di Tengah Kompas */
        .kaaba-center {
            position: absolute;
            width: 44px;
            height: 44px;
            background: #111;
            color: #ffd700;
            border: 2px solid #ffd700;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.3rem;
            z-index: 10;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        /* GARISAN LURUS AR & INDIKATOR KAABAH TERAPUNG */
        .ar-overlay-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            display: none; 
        }

        /* Garis Panduan Tegak Tengah Skrin */
        .ar-guide-line {
            position: absolute;
            left: 50%;
            top: 0;
            width: 2px;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,255,204,0), rgba(0,255,204,0.7) 50%, rgba(0,255,204,0));
            transform: translateX(-50%);
        }

        /* Ikon Terapung Kaabah dalam Mod AR */
        .ar-kaaba-target {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
            transition: left 0.1s linear; /* Bergerak selari dengan pusingan telefon */
        }

        .ar-kaaba-target i {
            font-size: 3.5rem;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #00ffcc;
        }

        .ar-kaaba-target span {
            font-weight: bold;
            font-size: 1rem;
            margin-top: 5px;
            background: rgba(0,0,0,0.7);
            padding: 2px 8px;
            border-radius: 5px;
        }

        /* ISYARAT ANAK PANAH KANAN / KIRI BERKELIP */
        .turn-indicator {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 3.5rem;
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
            display: none;
            animation: blink 0.6s infinite alternate;
            z-index: 5;
        }

        #turn-left { left: 25px; }
        #turn-right { right: 25px; }

        @keyframes blink {
            0% { opacity: 0.2; transform: translateY(-50%) scale(0.9); }
            100% { opacity: 1; transform: translateY(-50%) scale(1.1); }
        }

        /* Tanda Sempurna Tepat Arah Kiblat */
        .perfect-match {
            animation: pulse-green 0.5s infinite alternate;
            border-color: #00ffcc !important;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.8) !important;
        }

        @keyframes pulse-green {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }

        .info-panel {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            font-size: 0.9rem;
            max-width: 92%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 12px;
            justify-content: center;
        }

        button {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        button.btn-ar-active {
            background: #ff4d4d;
            color: #fff;
        }
    </style>
</head>
<body>

    <video id="webcam-video" autoplay playsinline muted></video>

    <!-- Visual Tambahan AR -->
    <div class="ar-overlay-view" id="arOverlay">
        <div class="ar-guide-line"></div>
        <div class="ar-kaaba-target" id="arKaabaTarget">
            <i class="fa-solid fa-kaaba"></i>
            <span>KIBLAT</span>
        </div>
    </div>

    <!-- Isyarat Gerak Sisi Telefon -->
    <div class="turn-indicator" id="turn-left"><i class="fa-solid fa-chevron-left"></i></div>
    <div class="turn-indicator" id="turn-right"><i class="fa-solid fa-chevron-right"></i></div>

    <div class="ui-container">
        <header>
            <h1>Falak Astronomi INSTUN</h1>
            <p style="font-size: 0.75rem; color: #bbb; margin-top:2px;">Kompas Isyarat Navigasi AR v2.0</p>
        </header>

        <div class="compass-wrapper">
            <div class="kaaba-center" id="centerKaabaIcon">
                <i class="fa-solid fa-kaaba"></i>
            </div>
            <div class="compass" id="compassRing">
                <!-- Senggatan akan dijana di sini menerusi JS -->
                <div class="ticks-container" id="ticksContainer"></div>
                <div class="rose">
                    <div class="direction dir-n">U</div>
                    <div class="direction dir-e">T</div>
                    <div class="direction dir-s">S</div>
                    <div class="direction dir-w">B</div>
                </div>
                <div class="qibla-arrow" id="qiblaArrow"></div>
            </div>
        </div>

        <div class="info-panel">
            <p id="status-text"><i class="fa-solid fa-spinner fa-spin"></i> Menjejak isyarat satelit...</p>
            <p id="angle-text" style="margin-top: 4px; color: #00ffcc; font-weight: bold; min-height: 20px;"></p>
            
            <div class="controls">
                <button id="btn-location" onclick="getLocation()"><i class="fa-solid fa-location-crosshairs"></i> Reset GPS</button>
                <button id="btn-ar" onclick="toggleAR()"><i class="fa-solid fa-camera"></i> Aktif AR</button>
            </div>
        </div>
    </div>

    <script>
        const KAABA_LAT = 21.4225;
        const KAABA_LNG = 39.8262;

        let userLat, userLng, qiblaAngle = null;
        let currentHeading = 0;
        let smoothedHeading = 0; // Menyimpan nilai kompas yang telah ditapis
        let isARActive = false;
        let videoStream = null;

        // Faktor penapisan Low-Pass (0.1 = Sangat stabil/perlahan, 0.3 = Sederhana responsif, 1.0 = Tanpa tapisan)
        const FILTER_FACTOR = 0.15; 

        const compassRing = document.getElementById('compassRing');
        const qiblaArrow = document.getElementById('qiblaArrow');
        const statusText = document.getElementById('status-text');
        const angleText = document.getElementById('angle-text');
        const btnAR = document.getElementById('btn-ar');
        const videoElement = document.getElementById('webcam-video');
        const arOverlay = document.getElementById('arOverlay');
        const arKaabaTarget = document.getElementById('arKaabaTarget');
        const turnLeftElement = document.getElementById('turn-left');
        const turnRightElement = document.getElementById('turn-right');
        const centerKaabaIcon = document.getElementById('centerKaabaIcon');

        // Generate Senggatan Kompas 10 Darjah secara Automatik
        function createCompassTicks() {
            const container = document.getElementById('ticksContainer');
            for (let i = 0; i < 360; i += 10) {
                if (i === 0 || i === 90 || i === 180 || i === 270) continue; // Langkau mata angin utama
                
                const isMajor = i % 30 === 0;
                const tick = document.createElement('div');
                tick.className = `tick ${isMajor ? 'major' : ''}`;
                tick.style.transform = `rotate(${i}deg)`;
                container.appendChild(tick);

                if (isMajor) {
                    const label = document.createElement('div');
                    label.className = 'tick-label';
                    label.innerText = i;
                    label.style.transform = `rotate(${i}deg)`;
                    container.appendChild(label);
                }
            }
        }
        createCompassTicks();

        function calculateQibla(lat, lng) {
            const phiK = KAABA_LAT * Math.PI / 180;
            const lambdaK = KAABA_LNG * Math.PI / 180;
            const phiU = lat * Math.PI / 180;
            const lambdaU = lng * Math.PI / 180;
            const deltaLambda = lambdaK - lambdaU;

            const y = Math.sin(deltaLambda);
            const x = Math.cos(phiU) * Math.tan(phiK) - Math.sin(phiU) * Math.cos(deltaLambda);
            let qibla = Math.atan2(y, x) * 180 / Math.PI;
            return (qibla + 360) % 360;
        }

        function getLocation() {
            if (!navigator.geolocation) {
                statusText.innerHTML = "Geolokasi tidak disokong pelayar.";
                return;
            }
            statusText.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Membaca data GPS...`;
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;
                    qiblaAngle = calculateQibla(userLat, userLng);
                    
                    statusText.innerHTML = `<i class="fa-solid fa-circle-check" style="color:#00ffcc"></i> GPS Berjaya Disahihkan.`;
                    
                    qiblaArrow.style.display = 'block';
                    qiblaArrow.style.transform = `rotate(${qiblaAngle}deg)`;
                    
                    initCompass();
                },
                (error) => {
                    statusText.innerHTML = `<i class="fa-solid fa-triangle-exclamation" style="color:#ff4d4d"></i> Aktifkan GPS anda & benarkan akses lokasi.`;
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        function initCompass() {
            if (window.DeviceOrientationEvent) {
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(state => {
                            if (state === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation, true);
                            }
                        }).catch(console.error);
                } else {
                    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                    window.addEventListener('deviceorientation', handleOrientation, true);
                }
                // Mulakan loop animasi penstabilan
                requestAnimationFrame(updateCompassSmoothly);
            } else {
                statusText.innerHTML = "Peranti tiada sensor orientasi.";
            }
        }

        function handleOrientation(event) {
            let heading = 0;
            if (event.webkitCompassHeading) {
                heading = event.webkitCompassHeading;
            } else if (event.alpha) {
                heading = 360 - event.alpha;
            }
            currentHeading = heading;
        }

        // Fungsi Menstabilkan Putaran Kompas (Low-pass Filter Matematik)
        function updateCompassSmoothly() {
            if (qiblaAngle !== null) {
                // Selesaikan isu lompatan sudut pada titik 0/360 darjah
                let diff = currentHeading - smoothedHeading;
                if (diff > 180) diff -= 360;
                if (diff < -180) diff += 360;

                smoothedHeading += diff * FILTER_FACTOR;
                smoothedHeading = (smoothedHeading + 360) % 360;

                // Putarkan piring kompas utama
                compassRing.style.transform = `rotate(${-smoothedHeading}deg)`;

                // Hitung perbezaan sudut antara hala telefon dengan arah kiblat nyata
                let relativeQiblaAngle = (qiblaAngle - smoothedHeading + 360) % 360;
                if (relativeQiblaAngle > 180) relativeQiblaAngle -= 360;

                // Kemaskini teks info darjah semasa
                angleText.innerHTML = `Kiblat: ${qiblaAngle.toFixed(1)}° | Sisihan: ${relativeQiblaAngle.toFixed(1)}°`;

                // LOGIK NAVIGASI KANAN / KIRI & MOD AR
                // Sempurna/Tepat jika sisihan kurang daripada 3 darjah
                if (Math.abs(relativeQiblaAngle) < 3) {
                    turnLeftElement.style.display = 'none';
                    turnRightElement.style.display = 'none';
                    compassRing.classList.add('perfect-match');
                    centerKaabaIcon.style.background = '#00ffcc';
                    centerKaabaIcon.style.color = '#000';
                    statusText.innerHTML = `<span style="color:#00ffcc; font-weight:bold;"><i class="fa-solid fa-square-check"></i> Menghadap Kiblat Tepat!</span>`;
                } else {
                    compassRing.classList.remove('perfect-match');
                    centerKaabaIcon.style.background = '#111';
                    centerKaabaIcon.style.color = '#ffd700';
                    statusText.innerHTML = `Pusingkan telefon mengikut anak panah petunjuk.`;

                    // Tunjukkan isyarat panah perlu pusing ke mana
                    if (relativeQiblaAngle > 0) {
                        turnRightElement.style.display = 'block';
                        turnLeftElement.style.display = 'none';
                    } else {
                        turnLeftElement.style.display = 'block';
                        turnRightElement.style.display = 'none';
                    }
                }

                // Pengiraan kedudukan Ikon Kaabah Terapung apabila kamera AR aktif
                if (isARActive) {
                    const screenWidth = window.innerWidth;
                    // Field of View anggaran kamera telefon biasa (~60 darjah paparan skrin)
                    const fov = 60; 
                    
                    if (Math.abs(relativeQiblaAngle) < (fov / 2)) {
                        // Jika arah kiblat ada dalam skrin kamera, posisikan secara dinamik
                        let percentX = 50 + (relativeQiblaAngle / (fov / 2)) * 50;
                        arKaabaTarget.style.display = 'flex';
                        arKaabaTarget.style.left = `${percentX}%`;
                    } else {
                        // Jika terkeluar skrin kamera, sembunyikan ikon sasaran AR tersebut
                        arKaabaTarget.style.display = 'none';
                    }
                }
            }
            requestAnimationFrame(updateCompassSmoothly);
        }

        async function toggleAR() {
            if (!isARActive) {
                try {
                    const constraints = {
                        video: { facingMode: { exact: "environment" } },
                        audio: false
                    };
                    videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                    videoElement.srcObject = videoStream;
                    videoElement.style.display = 'block';
                    arOverlay.style.display = 'block';
                    
                    btnAR.innerHTML = `<i class="fa-solid fa-camera-rotate"></i> Matikan AR`;
                    btnAR.classList.add('btn-ar-active');
                    isARActive = true;
                } catch (err) {
                    try {
                        videoStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                        videoElement.srcObject = videoStream;
                        videoElement.style.display = 'block';
                        arOverlay.style.display = 'block';
                        btnAR.innerHTML = `<i class="fa-solid fa-camera-rotate"></i> Matikan AR`;
                        btnAR.classList.add('btn-ar-active');
                        isARActive = true;
                    } catch (e) {
                        alert("Kamera tidak dapat diakses: " + e.message);
                    }
                }
            } else {
                if (videoStream) {
                    videoStream.getTracks().forEach(track => track.stop());
                }
                videoElement.style.display = 'none';
                arOverlay.style.display = 'none';
                btnAR.innerHTML = `<i class="fa-solid fa-camera"></i> Aktif AR`;
                btnAR.classList.remove('btn-ar-active');
                isARActive = false;
                
                // Padam penunjuk arah tepi skrin jika mod AR dimatikan supaya kemas
                turnLeftElement.style.display = 'none';
                turnRightElement.style.display = 'none';
            }
        }

        window.onload = () => {
            getLocation();
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(console.log);
            }
        };
    </script>
</body>
</html>
