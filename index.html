<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falak Astronomi INSTUN</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    
    <link rel="stylesheet" href="https://cloudflare.com">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            color: #fff;
        }

        #webcam-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            display: none;
        }

        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 25px 20px;
            background: rgba(0, 0, 0, 0.2);
        }

        header {
            text-align: center;
            backdrop-filter: blur(10px);
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 340px;
        }

        h1 {
            font-size: 1.3rem;
            color: #ffd700;
        }

        /* Rangka Kompas */
        .compass-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phone-heading-marker {
            position: absolute;
            top: -15px;
            left: calc(50% - 10px);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 15px solid #ff4d4d;
            z-index: 15;
            filter: drop-shadow(0 0 5px #ff4d4d);
        }

        /* PIRING KOMPAS DINAMIK */
        .compass {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #ffd700;
            background: rgba(10, 10, 10, 0.85);
            box-shadow: 0 0 25px rgba(215, 175, 0, 0.3);
            position: relative;
            will-change: transform;
        }

        .ticks-container {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .tick {
            position: absolute;
            width: 2px;
            height: 8px;
            background: rgba(255, 255, 255, 0.4);
            left: calc(50% - 1px);
            top: 0;
            transform-origin: 1px 144px;
        }

        .tick.major {
            height: 14px;
            background: #ffd700;
        }

        .tick-label {
            position: absolute;
            width: 30px;
            text-align: center;
            font-size: 0.65rem;
            color: #ccc;
            left: calc(50% - 15px);
            top: 16px;
            transform-origin: 15px 128px;
        }

        .rose {
            position: absolute;
            width: 100%;
            height: 100%;
            font-weight: bold;
            font-size: 1.2rem;
            z-index: 2;
        }

        .direction {
            position: absolute;
            width: 30px;
            text-align: center;
        }
        
        .dir-n { top: 32px; left: calc(50% - 15px); color: #ff4d4d; font-size: 1.3rem;}
        .dir-e { right: 32px; top: calc(50% - 12px); color: #fff; }
        .dir-s { bottom: 32px; left: calc(50% - 15px); color: #fff; }
        .dir-w { left: 32px; top: calc(50% - 12px); color: #fff; }

        .qibla-pointer-group {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 5;
        }

        .qibla-arrow {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-bottom: 50px solid #00ff00;
            top: 45px;
            left: calc(50% - 14px);
            filter: drop-shadow(0 0 10px #00ff00);
        }

        .qibla-kaaba-icon {
            position: absolute;
            top: 105px;
            left: calc(50% - 12px);
            font-size: 1.5rem;
            color: #ffd700;
            text-shadow: 0 0 5px #000;
        }

        /* KONTANIER TIMBANG AIR TEPAT DI TENGAH PIRING KOMPAS */
        .bubble-level-container {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid rgba(255, 215, 0, 0.6);
            background: rgba(0, 0, 0, 0.4);
            z-index: 10;
            top: calc(50% - 35px);
            left: calc(50% - 35px);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .bubble-target {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #00ff00;
            opacity: 0.7;
        }

        .bubble {
            position: absolute;
            width: 18px;
            height: 18px;
            background: radial-gradient(circle, #7fff00 20%, #00ff00 80%);
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff00;
            will-change: transform;
            transform: translate(0px, 0px);
        }

        /* PAPARAN MOD AR */
        .ar-overlay-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            display: none; 
        }

        .ar-guide-line {
            position: absolute;
            left: 50%;
            top: 0;
            width: 6px;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,255,0,0), rgba(0,255,0,1) 50%, rgba(0,255,0,0));
            transform: translateX(-50%);
            filter: drop-shadow(0 0 8px #00ff00);
        }

        /* STRUKTUR BARU INDIKATOR ARROW HEAD (SISI KIRI & SISI KANAN ATAS AR VIDEO) */
        .ar-top-navigation {
            position: absolute;
            top: 110px; /* Diturunkan sedikit dari kedudukan header */
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            pointer-events: none;
            z-index: 10;
        }

        /* Reka bentuk Kepala Anak Panah Menggunakan CSS Murni (Telus Sepenuhnya) */
        .nav-arrow-box {
            width: 40px;
            height: 40px;
            display: none;
            animation: blink-arrow 0.3s infinite alternate;
        }

        #arrow-left-box {
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-right: 20px solid #00ff00; /* Kepala anak panah menunjuk ke kiri */
            filter: drop-shadow(-4px 0 8px #00ff00);
        }

        #arrow-right-box {
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 20px solid #00ff00; /* Kepala anak panah menunjuk ke kanan */
            filter: drop-shadow(4px 0 8px #00ff00);
        }

        @keyframes blink-arrow {
            0% { opacity: 0.2; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.1); }
        }

        /* IKON KAABAH GERAKAN AR */
        .ar-kaaba-target {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 4;
            will-change: left;
        }

        .kaaba-box-visual {
            background: rgba(15, 15, 15, 0.9);
            border: 4px solid #00ff00;
            border-radius: 15px;
            padding: 15px 25px;
            box-shadow: 0 0 25px #00ff00;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .kaaba-box-visual i {
            font-size: 4rem;
            color: #ffd700;
        }

        .kaaba-box-visual span {
            font-weight: bold;
            font-size: 1.1rem;
            color: #00ff00;
            letter-spacing: 1px;
        }

        /* Efek Piring Berubah Warna & Denyutan Apabila Tepat Kiblat (Ralat 0) */
        .perfect-match {
            animation: pulse-green 0.4s infinite alternate;
            border-color: #00ff00 !important;
            box-shadow: 0 0 40px rgba(0, 255, 0, 1) !important;
        }

        @keyframes pulse-green {
            0% { transform: scale(1); }
            100% { transform: scale(1.04); }
        }

        .info-panel {
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 340px;
        }

        .btn-ar {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 12px 25px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 1rem;
            width: 100%;
            box-shadow: 0 4px 15px rgba(255,215,0,0.3);
        }

        /* BUTANG KALIBRASI GPS MANUAL */
        .btn-gps {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 8px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            width: 100%;
            justify-content: center;
        }

        .btn-gps:active {
            background: rgba(255, 255, 255, 0.3);
        }

        .status-text {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <video id="webcam-video" autoplay playsinline muted></video>

    <!-- Indikator Arrow Head Kiri Dan Kanan Berasingan Berasaskan Objek Grafik CSS Murni -->
    <div class="ar-top-navigation">
        <div id="arrow-left-box" class="nav-arrow-box"></div>
        <div id="arrow-right-box" class="nav-arrow-box"></div>
    </div>

    <div id="ar-view" class="ar-overlay-view">
        <div class="ar-guide-line"></div>
        <div id="ar-kaaba" class="ar-kaaba-target">
            <div class="kaaba-box-visual">
                <i class="fas fa-kaaba"></i>
                <span>KIBLAT</span>
            </div>
        </div>
    </div>

    <div class="ui-container">
        <header>
            <h1>Falak Astronomi INSTUN</h1>
            <div id="qibla-angle-display" style="color: #00ff00; font-weight: bold; font-size: 0.9rem; margin-top: 3px;">Mengira Kiblat...</div>
        </header>

        <div class="compass-wrapper">
            <div class="phone-heading-marker"></div>
            
            <div id="compass-plate" class="compass">
                
                <!-- Timbang Air Tetap Ditengah Piring Kompas -->
                <div class="bubble-level-container">
                    <div class="bubble-target"></div>
                    <div id="level-bubble" class="bubble"></div>
                </div>

                <div id="ticks-inner" class="ticks-container"></div>
                
                <div class="rose">
                    <div class="direction dir-n">U</div>
                    <div class="direction dir-e">T</div>
                    <div class="direction dir-s">S</div>
                    <div class="direction dir-w">B</div>
                </div>

                <div id="qibla-pointer" class="qibla-pointer-group">
                    <div class="qibla-arrow"></div>
                    <div class="qibla-kaaba-icon"><i class="fas fa-kaaba"></i></div>
                </div>
            </div>
        </div>

        <div class="info-panel">
            <div id="data-debug">Sila benarkan akses Sensor & Kamera</div>
            
            <!-- Mengembalikan Butang Kalibrasi GPS Semula -->
            <button id="btn-gps-calibrate" class="btn-gps">
                <i class="fas fa-sync-alt"></i> KEMAS KINI / KALIBRASI GPS
            </button>
            
            <button id="btn-toggle-ar" class="btn-ar">BUKA VIDEO AR</button>
            <div class="status-text">Pastikan peranti diletakkan rata untuk ketepatan optimum</div>
        </div>
    </div>

    <script>
        // --- 1. OPTIMASI KALMAN FILTER (STABIL DAN SENTIASA RESPONSIVE TANPA LAG) ---
        class KalmanFilter {
            constructor(q = 0.1, r = 0.4, x = 0, p = 1) { 
                this.q = q; 
                this.r = r; 
                this.x = x; 
                this.p = p; 
            }

            filter(measurement) {
                this.p = this.p + this.q;
                let k = this.p / (this.p + this.r);
                
                let diff = measurement - this.x;
                if (diff > 180) diff -= 360;
                if (diff < -180) diff += 360;
                
                this.x = this.x + k * diff;
                this.p = (1 - k) * this.p;

                if (this.x < 0) this.x += 360;
                if (this.x >= 360) this.x -= 360;

                return this.x;
            }
        }

        const compassFilter = new KalmanFilter(0.1, 0.4, 0, 1);

        // --- 2. PEMBAHAGIAN ELEMEN UI ---
        const compassPlate = document.getElementById('compass-plate');
        const qiblaPointer = document.getElementById('qibla-pointer');
        const ticksInner = document.getElementById('ticks-inner');
        const qiblaAngleDisplay = document.getElementById('qibla-angle-display');
        const dataDebug = document.getElementById('data-debug');
        const btnToggleAr = document.getElementById('btn-toggle-ar');
        const btnGpsCalibrate = document.getElementById('btn-gps-calibrate');
        const webcamVideo = document.getElementById('webcam-video');
        const arView = document.getElementById('ar-view');
        const arKaaba = document.getElementById('ar-kaaba');
        const levelBubble = document.getElementById('level-bubble');
        
        const arrowLeftBox = document.getElementById('arrow-left-box');
        const arrowRightBox = document.getElementById('arrow-right-box');

        let userLat = 3.1390;
        let userLon = 101.6869;
        let qiblaAzimuth = 292.75; 
        let currentHeading = 0;
        let isArMode = false;

        // --- 3. REKA BENTUK SENGGATAN KOMPAS ---
        function setupCompassTicks() {
            for (let i = 0; i < 360; i += 5) {
                if (i % 30 === 0) {
                    const tick = document.createElement('div');
                    tick.className = 'tick major';
                    tick.style.transform = `rotate(${i}deg)`;
                    ticksInner.appendChild(tick);

                    const label = document.createElement('div');
                    label.className = 'tick-label';
                    label.innerText = i;
                    label.style.transform = `rotate(${i}deg)`;
                    ticksInner.appendChild(label);
                } else if (i % 10 === 0) {
                    const tick = document.createElement('div');
                    tick.className = 'tick';
                    tick.style.transform = `rotate(${i}deg)`;
                    ticksInner.appendChild(tick);
                }
            }
        }
        setupCompassTicks();

        // --- 4. KIRAAN KIBLAT FORMULA ---
        function calculateQibla(lat, lon) {
            const makkahLat = 21.4225 * Math.PI / 180;
            const makkahLon = 39.8262 * Math.PI / 180;
            const phiLat = lat * Math.PI / 180;
            const lambdaLon = lon * Math.PI / 180;

            const y = Math.sin(makkahLon - lambdaLon);
            const x = Math.cos(phiLat) * Math.tan(makkahLat) - Math.sin(phiLat) * Math.cos(makkahLon - lambdaLon);
            
            let qiblaRad = Math.atan2(y, x);
            let qiblaDeg = qiblaRad * 180 / Math.PI;
            
            return (qiblaDeg + 360) % 360;
        }

        function updateLocation() {
            if (navigator.geolocation) {
                qiblaAngleDisplay.innerText = "Mengemas kini GPS...";
                navigator.geolocation.getCurrentPosition(position => {
                    userLat = position.coords.latitude;
                    userLon = position.coords.longitude;
                    qiblaAzimuth = calculateQibla(userLat, userLon);
                    
                    qiblaAngleDisplay.innerText = `Azimut Kiblat: ${qiblaAzimuth.toFixed(2)}°`;
                    qiblaPointer.style.transform = `rotate(${qiblaAzimuth}deg)`;
                    qiblaPointer.style.display = 'block';
                }, error => {
                    qiblaAngleDisplay.innerText = `Kiblat (Anggaran): ${qiblaAzimuth.toFixed(2)}°`;
                    qiblaPointer.style.transform = `rotate(${qiblaAzimuth}deg)`;
                    qiblaPointer.style.display = 'block';
                }, { enableHighAccuracy: true, timeout: 10000 });
            }
        }
        // Jalankan carian lokasi automatik pada permulaan apl
        updateLocation();

        // Tambah fungsi klik pada butang kalibrasi GPS manual
        btnGpsCalibrate.addEventListener('click', updateLocation);

        // --- 5. PEMROSESAN ORIENTASI & PANDUAN NAVIGASI REAL-TIME ---
        function handleOrientation(event) {
            let heading = event.webkitCompassHeading || event.alpha;
            
            if (heading === undefined || heading === null) return;

            if (!event.webkitCompassHeading) {
                heading = (360 - heading) % 360;
            }

            // Memproses nilai input mentah peranti dengan penapis stabil
            currentHeading = compassFilter.filter(heading);

            // Putaran piring kompas (Utara kompas kekal di Utara Sebenar bumi)
            compassPlate.style.transform = `rotate(${-currentHeading}deg)`;

            // PEMBETULAN: Logik perbezaan darjah ralat yang mematuhi hukum pusingan kompas
            let diff = qiblaAzimuth - currentHeading;
            if (diff > 180) diff -= 360;
            if (diff < -180) diff += 360;

            // Memposisikan sasaran visual Kaabah di skrin AR
            const fov = 75; 
            if (Math.abs(diff) < fov / 2) {
                arKaaba.style.display = 'flex';
                const xPos = 50 + (diff / (fov / 2)) * 50;
                arKaaba.style.left = `${xPos}%`;
            } else {
                arKaaba.style.display = 'none';
            }

            // PEMBETULAN JULAT TOLERANSI (PENGESAHAN RALAT 0 DARJAH)
            const tolerance = 2.0; 

            if (Math.abs(diff) <= tolerance) {
                // Tepat pada arah kiblat (Ralat dilaraskan terus menjadi 0° untuk mengelakkan kekeliruan visual)
                compassPlate.classList.add('perfect-match');
                arrowLeftBox.style.display = 'none';
                arrowRightBox.style.display = 'none';
                dataDebug.innerHTML = `<span style="color: #00ff00; font-weight:bold;">Tepati Kiblat! Ralat: 0.0°</span>`;
            } else {
                compassPlate.classList.remove('perfect-match');
                dataDebug.innerText = `Arah Telefon: ${currentHeading.toFixed(1)}° | Ralat: ${diff.toFixed(1)}°`;
                
                // PEMBETULAN PANDUAN ISYARAT SISI ARROW HEAD KANAN/KIRI TANPA LAG
                if (isArMode) {
                    if (diff > 0) {
                        arrowRightBox.style.display = 'block'; // Papar Arrow Head Kanan di Sisi Kanan Atas AR
                        arrowLeftBox.style.display = 'none';
                    } else {
                        arrowLeftBox.style.display = 'block';  // Papar Arrow Head Kiri di Sisi Kiri Atas AR
                        arrowRightBox.style.display = 'none';
                    }
                } else {
                    arrowLeftBox.style.display = 'none';
                    arrowRightBox.style.display = 'none';
                }
            }

            // LOGIK BUIH TIMBANG AIR (SERTA-MERTA & TEPAT)
            let pitch = event.beta;  
            let roll = event.gamma;  

            if (pitch !== null && roll !== null) {
                const maxOffset = 22; 
                
                let xOffset = (roll / 35) * maxOffset;
                let yOffset = (pitch / 35) * maxOffset;

                if (xOffset > maxOffset) xOffset = maxOffset;
                if (xOffset < -maxOffset) xOffset = -maxOffset;
                if (yOffset > maxOffset) yOffset = maxOffset;
                if (yOffset < -maxOffset) yOffset = -maxOffset;

                levelBubble.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
            }
        }

        async function requestSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation, true);
                    } else {
                        alert('Kebenaran akses sensor orientasi ditolak.');
                    }
                } catch (e) {
                    console.error(e);
                }
            } else {
                window.addEventListener('deviceorientation', handleOrientation, true);
            }
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }
                });
                webcamVideo.srcObject = stream;
                webcamVideo.style.display = 'block';
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    webcamVideo.srcObject = fallbackStream;
                    webcamVideo.style.display = 'block';
                } catch (e) {
                    alert('Kamera gagal diakses: ' + e.message);
                }
            }
        }

        function stopCamera() {
            const stream = webcamVideo.srcObject;
            if (stream) {
                const tracks = stream.getTracks();
                tracks.forEach(track => track.stop());
            }
            webcamVideo.style.display = 'none';
        }

        btnToggleAr.addEventListener('click', async () => {
            await requestSensors(); 

            if (!isArMode) {
                await startCamera();
                arView.style.display = 'block';
                btnToggleAr.innerText = "TUTUP VIDEO AR";
                btnToggleAr.style.background = "#ff4d4d";
                btnToggleAr.style.color = "#fff";
                isArMode = true;
            } else {
                stopCamera();
                arView.style.display = 'none';
                arrowLeftBox.style.display = 'none';
                arrowRightBox.style.display = 'none';
                btnToggleAr.innerText = "BUKA VIDEO AR";
                btnToggleAr.style.background = "#ffd700";
                btnToggleAr.style.color = "#000";
                isArMode = false;
            }
        });
    </script>
</body>
</html>
