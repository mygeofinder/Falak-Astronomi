<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falak Astronomi INSTUN</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    
    <link rel="stylesheet" href="https://cloudflare.com">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            color: #fff;
        }

        #webcam-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            display: none;
        }

        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 25px 20px;
            background: rgba(0, 0, 0, 0.3);
        }

        header {
            text-align: center;
            backdrop-filter: blur(10px);
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 1.3rem;
            color: #ffd700;
        }

        /* Rangka Kompas */
        .compass-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Piring Kompas Kini STATIK (Utara Tetap Di Atas) */
        .compass {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #ffd700;
            background: rgba(10, 10, 10, 0.85);
            box-shadow: 0 0 25px rgba(215, 175, 0, 0.3);
            position: relative;
        }

        .ticks-container {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .tick {
            position: absolute;
            width: 2px;
            height: 8px;
            background: rgba(255, 255, 255, 0.4);
            left: calc(50% - 1px);
            top: 0;
            transform-origin: 1px 144px;
        }

        .tick.major {
            height: 14px;
            background: #ffd700;
        }

        .tick-label {
            position: absolute;
            width: 30px;
            text-align: center;
            font-size: 0.65rem;
            color: #ccc;
            left: calc(50% - 15px);
            top: 16px;
            transform-origin: 15px 128px;
        }

        .rose {
            position: absolute;
            width: 100%;
            height: 100%;
            font-weight: bold;
            font-size: 1.2rem;
            z-index: 2;
        }

        .direction {
            position: absolute;
            width: 30px;
            text-align: center;
        }
        /* Kedudukan Tetap Mata Angin */
        .dir-n { top: 32px; left: calc(50% - 15px); color: #ff4d4d; font-size: 1.3rem;}
        .dir-e { right: 32px; top: calc(50% - 12px); color: #fff; }
        .dir-s { bottom: 32px; left: calc(50% - 15px); color: #fff; }
        .dir-w { left: 32px; top: calc(50% - 12px); color: #fff; }

        /* JARUM KIBLAT BERPUTAR (Hanya Jarum & Ikon Ini Yang Berpusing) */
        .qibla-pointer-group {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: none;
            /* Peralihan lancar menggunakan penapis JS + CSS */
            transition: transform 0.15s ease-out; 
        }

        /* Anak Panah Hijau Menunjuk Kiblat */
        .qibla-arrow {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-bottom: 50px solid #00ffcc;
            top: 45px;
            left: calc(50% - 14px);
            filter: drop-shadow(0 0 8px #00ffcc);
        }

        /* Ikon Kaabah Kecil Dilekatkan pada Anak Panah Hijau Kiblat */
        .qibla-kaaba-icon {
            position: absolute;
            top: 105px;
            left: calc(50% - 12px);
            font-size: 1.5rem;
            color: #ffd700;
            text-shadow: 0 0 5px #000;
        }

        /* Hub Tengah Kompas */
        .compass-center {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ffd700;
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 0 8px rgba(0,0,0,0.8);
        }

        /* PAPARAN MOD AR */
        .ar-overlay-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            display: none; 
        }

        /* Garisan Lurus Penunjuk Tengah Skrin */
        .ar-guide-line {
            position: absolute;
            left: 50%;
            top: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,255,204,0), rgba(0,255,204,0.8) 50%, rgba(0,255,204,0));
            transform: translateX(-50%);
        }

        /* IKON KAABAH GERAKAN AR (DIKEMAS KINI) */
        .ar-kaaba-target {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 4;
            transition: left 0.1s ease-out;
        }

        /* Reka bentuk kotak visual ikon kaabah AR yang jelas */
        .kaaba-box-visual {
            background: rgba(15, 15, 15, 0.9);
            border: 3px solid #00ffcc;
            border-radius: 15px;
            padding: 15px 25px;
            box-shadow: 0 0 25px #00ffcc;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .kaaba-box-visual i {
            font-size: 4rem;
            color: #ffd700;
        }

        .kaaba-box-visual span {
            font-weight: bold;
            font-size: 1.1rem;
            color: #00ffcc;
            letter-spacing: 1px;
        }

        /* INDIKATOR KANAN KIRI BERKELIP */
        .turn-indicator {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 4rem;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.9);
            display: none;
            animation: blink 0.5s infinite alternate;
            z-index: 5;
        }

        #turn-left { left: 30px; }
        #turn-right { right: 30px; }

        @keyframes blink {
            0% { opacity: 0.2; transform: translateY(-50%) scale(0.9); }
            100% { opacity: 1; transform: translateY(-50%) scale(1.1); }
        }

        /* Kesan Apabila Menghadap Kiblat Tepat */
        .perfect-match {
            animation: pulse-green 0.4s infinite alternate;
            border-color: #00ffcc !important;
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.9) !important;
        }

        @keyframes pulse-green {
            0% { transform: scale(1); }
            100% { transform: scale(1.04); }
        }

        .info-panel {
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            font-size: 0.9rem;
            max-width: 92%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 12px;
            justify-content: center;
        }

        button {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        button.btn-ar-active {
            background: #ff4d4d;
            color: #fff;
        }
    </style>
</head>
<body>

    <video id="webcam-video" autoplay playsinline muted></video>

    <!-- Overlay Kamera AR -->
    <div class="ar-overlay-view" id="arOverlay">
        <div class="ar-guide-line"></div>
        <div class="ar-kaaba-target" id="arKaabaTarget">
            <div class="kaaba-box-visual">
                <i class="fa-solid fa-kaaba"></i>
                <span>KIBLAT</span>
            </div>
        </div>
    </div>

    <!-- Isyarat Sebelah Sisi Skrin -->
    <div class="turn-indicator" id="turn-left"><i class="fa-solid fa-angle-left"></i> PUSING KIRI</div>
    <div class="turn-indicator" id="turn-right">PUSING KANAN <i class="fa-solid fa-angle-right"></i></div>

    <div class="ui-container">
        <header>
            <h1>Falak Astronomi INSTUN</h1>
            <p style="font-size: 0.75rem; color: #bbb; margin-top:2px;">Kompas Anti-Getaran AR v3.0</p>
        </header>

        <!-- Paparan Kompas -->
        <div class="compass-wrapper">
            <div class="compass-center"></div>
            <div class="compass" id="compassRing">
                <div class="ticks-container" id="ticksContainer"></div>
                <div class="rose">
                    <div class="direction dir-n">U</div>
                    <div class="direction dir-e">T</div>
                    <div class="direction dir-s">S</div>
                    <div class="direction dir-w">B</div>
                </div>
                
                <!-- Kumpulan Jarum & Ikon Kiblat yang akan berpusing secara bebas -->
                <div class="qibla-pointer-group" id="qiblaPointerGroup">
                    <div class="qibla-arrow"></div>
                    <i class="fa-solid fa-kaaba qibla-kaaba-icon"></i>
                </div>
            </div>
        </div>

        <div class="info-panel">
            <p id="status-text"><i class="fa-solid fa-spinner fa-spin"></i> Menapis isyarat kompas...</p>
            <p id="angle-text" style="margin-top: 4px; color: #00ffcc; font-weight: bold; min-height: 20px;"></p>
            
            <div class="controls">
                <button id="btn-location" onclick="getLocation()"><i class="fa-solid fa-location-crosshairs"></i> Kalibrasi GPS</button>
                <button id="btn-ar" onclick="toggleAR()"><i class="fa-solid fa-camera"></i> Mod Kamera AR</button>
            </div>
        </div>
    </div>

    <script>
        const KAABA_LAT = 21.4225;
        const KAABA_LNG = 39.8262;

        let userLat, userLng, qiblaAngle = null;
        let currentHeading = 0;
        let smoothedHeading = 0;
        
        // PENTING: Nilai lebih kecil (0.05) bermaksud penapisan getaran tangan yang sangat keras/kukuh
        const STABILIZER_FACTOR = 0.06; 

        let isARActive = false;
        let videoStream = null;

        const compassRing = document.getElementById('compassRing');
        const qiblaPointerGroup = document.getElementById('qiblaPointerGroup');
        const statusText = document.getElementById('status-text');
        const angleText = document.getElementById('angle-text');
        const btnAR = document.getElementById('btn-ar');
        const videoElement = document.getElementById('webcam-video');
        const arOverlay = document.getElementById('arOverlay');
        const arKaabaTarget = document.getElementById('arKaabaTarget');
        const turnLeftElement = document.getElementById('turn-left');
        const turnRightElement = document.getElementById('turn-right');

        // Bina senggatan 10 darjah pada perimeter kompas statik
        function createCompassTicks() {
            const container = document.getElementById('ticksContainer');
            for (let i = 0; i < 360; i += 10) {
                if (i === 0 || i === 90 || i === 180 || i === 270) continue;
                
                const isMajor = i % 30 === 0;
                const tick = document.createElement('div');
                tick.className = `tick ${isMajor ? 'major' : ''}`;
                tick.style.transform = `rotate(${i}deg)`;
                container.appendChild(tick);

                if (isMajor) {
                    const label = document.createElement('div');
                    label.className = 'tick-label';
                    label.innerText = i;
                    label.style.transform = `rotate(${i}deg)`;
                    container.appendChild(label);
                }
            }
        }
        createCompassTicks();

        function calculateQibla(lat, lng) {
            const phiK = KAABA_LAT * Math.PI / 180;
            const lambdaK = KAABA_LNG * Math.PI / 180;
            const phiU = lat * Math.PI / 180;
            const lambdaU = lng * Math.PI / 180;
            const deltaLambda = lambdaK - lambdaU;

            const y = Math.sin(deltaLambda);
            const x = Math.cos(phiU) * Math.tan(phiK) - Math.sin(phiU) * Math.cos(deltaLambda);
            let qibla = Math.atan2(y, x) * 180 / Math.PI;
            return (qibla + 360) % 360;
        }

        function getLocation() {
            if (!navigator.geolocation) {
                statusText.innerHTML = "Geolokasi tidak disokong.";
                return;
            }
            statusText.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Menyelaras kedudukan GPS...`;
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;
                    qiblaAngle = calculateQibla(userLat, userLng);
                    
                    statusText.innerHTML = `<i class="fa-solid fa-circle-check" style="color:#00ffcc"></i> Koordinat GPS Dikunci.`;
                    qiblaPointerGroup.style.display = 'block';
                    
                    initCompass();
                },
                (error) => {
                    statusText.innerHTML = `<i class="fa-solid fa-triangle-exclamation" style="color:#ff4d4d"></i> Gagal dapatkan GPS. Sila buka kebenaran Lokasi.`;
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        function initCompass() {
            if (window.DeviceOrientationEvent) {
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(state => {
                            if (state === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation, true);
                            }
                        }).catch(console.error);
                } else {
                    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                    window.addEventListener('deviceorientation', handleOrientation, true);
                }
                requestAnimationFrame(processFiltersSmoothly);
            } else {
                statusText.innerHTML = "Sensor orientasi tidak ditemui.";
            }
        }

        function handleOrientation(event) {
            let heading = 0;
            if (event.webkitCompassHeading) {
                heading = event.webkitCompassHeading;
            } else if (event.alpha) {
                heading = 360 - event.alpha;
            }
            currentHeading = heading;
        }

        // PENAPIS ISYARAT MATEMATIK BERGANDA (Anti-Jitter Algorithm)
        function processFiltersSmoothly() {
            if (qiblaAngle !== null) {
                let diff = currentHeading - smoothedHeading;
                if (diff > 180) diff -= 360;
                if (diff < -180) diff += 360;

                // Mengira nilai sudut bertapis tegar bagi menghentikan gegaran tangan
                smoothedHeading += diff * STABILIZER_FACTOR;
                smoothedHeading = (smoothedHeading + 360) % 360;

                // Logik Penting: Piring Kompas (Huruf U) diam, hanya Jarum Kiblat berpusing secara relatif
                // Formula: Sudut Kiblat Relatif = (Azimut Kiblat - Hala Telefon Semasa)
                let relativeQiblaAngle = (qiblaAngle - smoothedHeading + 360) % 360;
                
                // Putarkan anak panah hijau + ikon kaabah di dalam kompas
                qiblaPointerGroup.style.transform = `rotate(${relativeQiblaAngle}deg)`;

                // Tukar skala ke julat -180 hingga 180 untuk pemprosesan navigasi kanan/kiri
                let navigationDiff = relativeQiblaAngle;
                if (navigationDiff > 180) navigationDiff -= 360;

                angleText.innerHTML = `Kiblat: ${qiblaAngle.toFixed(1)}° | Sisihan: ${navigationDiff.toFixed(1)}°`;

                // Sistem Penunjuk Toleransi Tepat (Ralat di bawah 3.5 darjah)
                if (Math.abs(navigationDiff) < 3.5) {
                    turnLeftElement.style.display = 'none';
                    turnRightElement.style.display = 'none';
                    compassRing.classList.add('perfect-match');
                    statusText.innerHTML = `<span style="color:#00ffcc; font-weight:bold;"><i class="fa-solid fa-square-check"></i> SAH: Menghadap Arah Kiblat!</span>`;
                } else {
                    compassRing.classList.remove('perfect-match');
                    
                    // Aktifkan anak panah teks bantuan di tepi skrin
                    if (navigationDiff > 0) {
                        turnRightElement.style.display = 'block';
                        turnLeftElement.style.display = 'none';
                    } else {
                        turnLeftElement.style.display = 'block';
                        turnRightElement.style.display = 'none';
                    }
                    statusText.innerHTML = `Pusingkan peranti anda untuk membetulkan arah.`;
                }

                // KAWALAN MOD KAMERA AR (Ikon Kaabah Besar Terapung)
                if (isARActive) {
                    const fov = 65; // Lebar sudut pandangan kamera skrin telefon
                    if (Math.abs(navigationDiff) < (fov / 2)) {
                        // Letakkan kedudukan mengikut peratusan lebar skrin
                        let percentX = 50 + (navigationDiff / (fov / 2)) * 50;
                        arKaabaTarget.style.display = 'flex';
                        arKaabaTarget.style.left = `${percentX}%`;
                    } else {
                        arKaabaTarget.style.display = 'none'; // Sembunyikan jika telefon dipusing jauh
                    }
                }
            }
            requestAnimationFrame(processFiltersSmoothly);
        }

        async function toggleAR() {
            if (!isARActive) {
                try {
                    const constraints = {
                        video: { facingMode: { exact: "environment" } },
                        audio: false
                    };
                    videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                    videoElement.srcObject = videoStream;
                    videoElement.style.display = 'block';
                    arOverlay.style.display = 'block';
                    
                    btnAR.innerHTML = `<i class="fa-solid fa-camera-rotate"></i> Matikan AR`;
                    btnAR.classList.add('btn-ar-active');
                    isARActive = true;
                } catch (err) {
                    try {
                        videoStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                        videoElement.srcObject = videoStream;
                        videoElement.style.display = 'block';
                        arOverlay.style.display = 'block';
                        btnAR.innerHTML = `<i class="fa-solid fa-camera-rotate"></i> Matikan AR`;
                        btnAR.classList.add('btn-ar-active');
                        isARActive = true;
                    } catch (e) {
                        alert("Kamera gagal dimuatkan: " + e.message);
                    }
                }
            } else {
                if (videoStream) {
                    videoStream.getTracks().forEach(track => track.stop());
                }
                videoElement.style.display = 'none';
                arOverlay.style.display = 'none';
                btnAR.innerHTML = `<i class="fa-solid fa-camera"></i> Mod Kamera AR`;
                btnAR.classList.remove('btn-ar-active');
                isARActive = false;
                
                turnLeftElement.style.display = 'none';
                turnRightElement.style.display = 'none';
            }
        }

        window.onload = () => {
            getLocation();
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(console.log);
            }
        };
    </script>
</body>
</html>
