<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falak Astronomi INSTUN</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    
    <link rel="stylesheet" href="https://cloudflare.com">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            color: #fff;
        }

        #webcam-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            display: none;
        }

        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 25px 20px;
            background: rgba(0, 0, 0, 0.2);
        }

        header {
            text-align: center;
            backdrop-filter: blur(10px);
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 1.3rem;
            color: #ffd700;
        }

        /* Rangka Kompas */
        .compass-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phone-heading-marker {
            position: absolute;
            top: -15px;
            left: calc(50% - 10px);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 15px solid #ff4d4d;
            z-index: 15;
            filter: drop-shadow(0 0 5px #ff4d4d);
        }

        /* PIRING KOMPAS DINAMIK */
        .compass {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #ffd700;
            background: rgba(10, 10, 10, 0.85);
            box-shadow: 0 0 25px rgba(215, 175, 0, 0.3);
            position: relative;
            will-change: transform;
        }

        .ticks-container {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .tick {
            position: absolute;
            width: 2px;
            height: 8px;
            background: rgba(255, 255, 255, 0.4);
            left: calc(50% - 1px);
            top: 0;
            transform-origin: 1px 144px;
        }

        .tick.major {
            height: 14px;
            background: #ffd700;
        }

        .tick-label {
            position: absolute;
            width: 30px;
            text-align: center;
            font-size: 0.65rem;
            color: #ccc;
            left: calc(50% - 15px);
            top: 16px;
            transform-origin: 15px 128px;
        }

        .rose {
            position: absolute;
            width: 100%;
            height: 100%;
            font-weight: bold;
            font-size: 1.2rem;
            z-index: 2;
        }

        .direction {
            position: absolute;
            width: 30px;
            text-align: center;
        }
        
        .dir-n { top: 32px; left: calc(50% - 15px); color: #ff4d4d; font-size: 1.3rem;}
        .dir-e { right: 32px; top: calc(50% - 12px); color: #fff; }
        .dir-s { bottom: 32px; left: calc(50% - 15px); color: #fff; }
        .dir-w { left: 32px; top: calc(50% - 12px); color: #fff; }

        .qibla-pointer-group {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 5;
        }

        .qibla-arrow {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-bottom: 50px solid #00ff00;
            top: 45px;
            left: calc(50% - 14px);
            filter: drop-shadow(0 0 10px #00ff00);
        }

        .qibla-kaaba-icon {
            position: absolute;
            top: 105px;
            left: calc(50% - 12px);
            font-size: 1.5rem;
            color: #ffd700;
            text-shadow: 0 0 5px #000;
        }

        /* PERBAIKAN CANGKERANG TIMBANG AIR (LEVEL BUBBLE) - BERADA TEPAT DI TENGAH */
        .bubble-level-container {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid rgba(255, 215, 0, 0.6);
            background: rgba(0, 0, 0, 0.4);
            z-index: 10;
            top: calc(50% - 35px);
            left: calc(50% - 35px);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .bubble-target {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #00ff00;
            opacity: 0.7;
        }

        /* BUIH HIJAU DIPERBESAR */
        .bubble {
            position: absolute;
            width: 18px; /* Dibesarkan daripada 14px */
            height: 18px; /* Dibesarkan daripada 14px */
            background: radial-gradient(circle, #7fff00 20%, #00ff00 80%);
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff00;
            will-change: transform;
            transform: translate(0px, 0px);
        }

        /* PAPARAN MOD AR */
        .ar-overlay-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            display: none; 
        }

        .ar-guide-line {
            position: absolute;
            left: 50%;
            top: 0;
            width: 6px;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,255,0,0), rgba(0,255,0,1) 50%, rgba(0,255,0,0));
            transform: translateX(-50%);
            filter: drop-shadow(0 0 8px #00ff00);
        }

        /* PERBAIKAN STRUKTUR PANDUAN INDIKATOR SISI ATAS (SISI KIRI & SISI KANAN) */
        .ar-top-navigation {
            position: absolute;
            top: 40px;
            width: 100%;
            height: 80px;
            pointer-events: none;
            z-index: 10;
        }

        /* Rekabentuk Kepala Anak Panah Telus Tanpa Latar Belakang Kotak/Butang */
        .nav-arrow {
            position: absolute;
            font-size: 3.5rem;
            color: #00ff00;
            filter: drop-shadow(0 0 12px #00ff00);
            display: none;
            line-height: 1;
            background: none !important;
            border: none !important;
            box-shadow: none !important;
            animation: blink-arrow 0.3s infinite alternate;
        }

        #arrow-left {
            left: 25px; /* Tetap di Sisi Kiri Atas AR */
        }

        #arrow-right {
            right: 25px; /* Tetap di Sisi Kanan Atas AR */
        }

        @keyframes blink-arrow {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* IKON KAABAH GERAKAN AR */
        .ar-kaaba-target {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 4;
            will-change: left;
        }

        .kaaba-box-visual {
            background: rgba(15, 15, 15, 0.9);
            border: 4px solid #00ff00;
            border-radius: 15px;
            padding: 15px 25px;
            box-shadow: 0 0 25px #00ff00;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .kaaba-box-visual i {
            font-size: 4rem;
            color: #ffd700;
        }

        .kaaba-box-visual span {
            font-weight: bold;
            font-size: 1.1rem;
            color: #00ff00;
            letter-spacing: 1px;
        }

        .perfect-match {
            animation: pulse-green 0.4s infinite alternate;
            border-color: #00ff00 !important;
            box-shadow: 0 0 40px rgba(0, 255, 0, 1) !important;
        }

        @keyframes pulse-green {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .info-panel {
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 340px;
        }

        .btn-ar {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 12px 25px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 1rem;
            width: 100%;
            box-shadow: 0 4px 15px rgba(255,215,0,0.3);
        }

        .status-text {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <video id="webcam-video" autoplay playsinline muted></video>

    <!-- Struktur Indikator Sisi Kiri Dan Kanan Berasingan -->
    <div class="ar-top-navigation">
        <div id="arrow-left" class="nav-arrow">🖝</div> <!-- Menggunakan Kepala Anak Panah Sahaja -->
        <div id="arrow-right" class="nav-arrow">🖜</div>
    </div>

    <div id="ar-view" class="ar-overlay-view">
        <div class="ar-guide-line"></div>
        <div id="ar-kaaba" class="ar-kaaba-target">
            <div class="kaaba-box-visual">
                <i class="fas fa-kaaba"></i>
                <span>KIBLAT</span>
            </div>
        </div>
    </div>

    <div class="ui-container">
        <header>
            <h1>Falak Astronomi INSTUN</h1>
            <div id="qibla-angle-display" style="color: #00ff00; font-weight: bold; font-size: 0.9rem; margin-top: 3px;">Mengira Kiblat...</div>
        </header>

        <div class="compass-wrapper">
            <div class="phone-heading-marker"></div>
            
            <div id="compass-plate" class="compass">
                
                <!-- Kontainer Timbang Air Ditandakan Tetap Ditengah Piring -->
                <div class="bubble-level-container">
                    <div class="bubble-target"></div>
                    <div id="level-bubble" class="bubble"></div>
                </div>

                <div id="ticks-inner" class="ticks-container"></div>
                
                <div class="rose">
                    <div class="direction dir-n">U</div>
                    <div class="direction dir-e">T</div>
                    <div class="direction dir-s">S</div>
                    <div class="direction dir-w">B</div>
                </div>

                <div id="qibla-pointer" class="qibla-pointer-group">
                    <div class="qibla-arrow"></div>
                    <div class="qibla-kaaba-icon"><i class="fas fa-kaaba"></i></div>
                </div>
            </div>
        </div>

        <div class="info-panel">
            <div id="data-debug">Sila benarkan akses Sensor & Kamera</div>
            <button id="btn-toggle-ar" class="btn-ar">BUKA VIDEO AR</button>
            <div class="status-text">Pastikan peranti diletakkan rata untuk ketepatan optimum</div>
        </div>
    </div>

    <script>
        // --- 1. OPTIMASI KALMAN FILTER (MENGHAPUSKAN KELEWATAN / LAG & MEMASTIKAN REAKSI TEPAT) ---
        class KalmanFilter {
            constructor(q = 0.4, r = 0.1, x = 0, p = 1) { 
                // Nilai q dinaikkan ke 0.4 dan r dikurangkan ke 0.1 supaya pergerakan dikesan serta-merta tanpa lag
                this.q = q; 
                this.r = r; 
                this.x = x; 
                this.p = p; 
            }

            filter(measurement) {
                this.p = this.p + this.q;
                let k = this.p / (this.p + this.r);
                
                let diff = measurement - this.x;
                if (diff > 180) diff -= 360;
                if (diff < -180) diff += 360;
                
                this.x = this.x + k * diff;
                this.p = (1 - k) * this.p;

                if (this.x < 0) this.x += 360;
                if (this.x >= 360) this.x -= 360;

                return this.x;
            }
        }

        const compassFilter = new KalmanFilter(0.4, 0.1, 0, 1);

        // --- 2. PEMBAHAGIAN ELEMEN UI ---
        const compassPlate = document.getElementById('compass-plate');
        const qiblaPointer = document.getElementById('qibla-pointer');
        const ticksInner = document.getElementById('ticks-inner');
        const qiblaAngleDisplay = document.getElementById('qibla-angle-display');
        const dataDebug = document.getElementById('data-debug');
        const btnToggleAr = document.getElementById('btn-toggle-ar');
        const webcamVideo = document.getElementById('webcam-video');
        const arView = document.getElementById('ar-view');
        const arKaaba = document.getElementById('ar-kaaba');
        const levelBubble = document.getElementById('level-bubble');
        
        const arrowLeft = document.getElementById('arrow-left');
        const arrowRight = document.getElementById('arrow-right');

        let userLat = 3.1390;
        let userLon = 101.6869;
        let qiblaAzimuth = 292.75; 
        let currentHeading = 0;
        let isArMode = false;

        // --- 3. REKA BENTUK SENGGATAN KOMPAS ---
        function setupCompassTicks() {
            for (let i = 0; i < 360; i += 5) {
                if (i % 30 === 0) {
                    const tick = document.createElement('div');
                    tick.className = 'tick major';
                    tick.style.transform = `rotate(${i}deg)`;
                    ticksInner.appendChild(tick);

                    const label = document.createElement('div');
                    label.className = 'tick-label';
                    label.innerText = i;
                    label.style.transform = `rotate(${i}deg)`;
                    ticksInner.appendChild(label);
                } else if (i % 10 === 0) {
                    const tick = document.createElement('div');
                    tick.className = 'tick';
                    tick.style.transform = `rotate(${i}deg)`;
                    ticksInner.appendChild(tick);
                }
            }
        }
        setupCompassTicks();

        // --- 4. KIRAAN KIBLAT FORMULA ---
        function calculateQibla(lat, lon) {
            const makkahLat = 21.4225 * Math.PI / 180;
            const makkahLon = 39.8262 * Math.PI / 180;
            const phiLat = lat * Math.PI / 180;
            const lambdaLon = lon * Math.PI / 180;

            const y = Math.sin(makkahLon - lambdaLon);
            const x = Math.cos(phiLat) * Math.tan(makkahLat) - Math.sin(phiLat) * Math.cos(makkahLon - lambdaLon);
            
            let qiblaRad = Math.atan2(y, x);
            let qiblaDeg = qiblaRad * 180 / Math.PI;
            
            return (qiblaDeg + 360) % 360;
        }

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                userLat = position.coords.latitude;
                userLon = position.coords.longitude;
                qiblaAzimuth = calculateQibla(userLat, userLon);
                
                qiblaAngleDisplay.innerText = `Azimut Kiblat: ${qiblaAzimuth.toFixed(2)}°`;
                qiblaPointer.style.transform = `rotate(${qiblaAzimuth}deg)`;
                qiblaPointer.style.display = 'block';
            }, error => {
                qiblaAngleDisplay.innerText = `Kiblat (Anggaran): ${qiblaAzimuth.toFixed(2)}°`;
                qiblaPointer.style.transform = `rotate(${qiblaAzimuth}deg)`;
                qiblaPointer.style.display = 'block';
            }, { enableHighAccuracy: true });
        }

        // --- 5. PEMROSESAN ORIENTASI & PANDUAN NAVIGASI REAL-TIME ---
        function handleOrientation(event) {
            let heading = event.webkitCompassHeading || event.alpha;
            
            if (heading === undefined || heading === null) return;

            if (!event.webkitCompassHeading) {
                heading = (360 - heading) % 360;
            }

            // Memproses nilai input mentah peranti dengan penapis berprestasi tinggi tanpa lag
            currentHeading = compassFilter.filter(heading);

            // Putaran piring kompas
            compassPlate.style.transform = `rotate(${-currentHeading}deg)`;

            let diff = qiblaAzimuth - currentHeading;
            if (diff > 180) diff -= 360;
            if (diff < -180) diff += 360;

            // Memperbetulkan pepijat pergerakan kedudukan sasaran Kaabah di skrin AR
            const fov = 75; 
            if (Math.abs(diff) < fov / 2) {
                arKaaba.style.display = 'flex';
                const xPos = 50 + (diff / (fov / 2)) * 50;
                arKaaba.style.left = `${xPos}%`; // Pembetulan kod dari .style.style.left sebelum ini
            } else {
                arKaaba.style.display = 'none';
            }

            // Logik Penunjuk Sisi Atas Tanpa Lag
            const tolerance = 1.5; 

            if (Math.abs(diff) <= tolerance) {
                compassPlate.classList.add('perfect-match');
                arrowLeft.style.display = 'none';
                arrowRight.style.display = 'none';
                dataDebug.innerHTML = `<span style="color: #00ff00; font-weight:bold;">Tepati Kiblat! Arah: ${currentHeading.toFixed(1)}°</span>`;
            } else {
                compassPlate.classList.remove('perfect-match');
                dataDebug.innerText = `Arah Telefon: ${currentHeading.toFixed(1)}° | Ralat: ${diff.toFixed(1)}°`;
                
                if (isArMode) {
                    if (diff > 0) {
                        arrowRight.style.display = 'block'; // Diaktifkan serta-merta di Sisi Kanan Atas
                        arrowLeft.style.display = 'none';
                    } else {
                        arrowLeft.style.display = 'block';  // Diaktifkan serta-merta di Sisi Kiri Atas
                        arrowRight.style.display = 'none';
                    }
                } else {
                    arrowLeft.style.display = 'none';
                    arrowRight.style.display = 'none';
                }
            }

            // --- PERBAIKAN LOGIK BUIH TIMBANG AIR (SERTA-MERTA & TEPAT) ---
            let pitch = event.beta;  
            let roll = event.gamma;  

            if (pitch !== null && roll !== null) {
                const maxOffset = 22; // Had maksimum pergerakan buih di dalam bulatan
                
                // Mengira perubahan posisi buih tanpa kesan lengah (lag)
                let xOffset = (roll / 35) * maxOffset;
                let yOffset = (pitch / 35) * maxOffset;

                if (xOffset > maxOffset) xOffset = maxOffset;
                if (xOffset < -maxOffset) xOffset = -maxOffset;
                if (yOffset > maxOffset) yOffset = maxOffset;
                if (yOffset < -maxOffset) yOffset = -maxOffset;

                // Memposisikan buih berdasarkan anjakan dari titik tengah piring kompas
                levelBubble.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
            }
        }

        async function requestSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation, true);
                    } else {
                        alert('Kebenaran akses sensor orientasi ditolak.');
                    }
                } catch (e) {
                    console.error(e);
                }
            } else {
                window.addEventListener('deviceorientation', handleOrientation, true);
            }
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }
                });
                webcamVideo.srcObject = stream;
                webcamVideo.style.display = 'block';
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    webcamVideo.srcObject = fallbackStream;
                    webcamVideo.style.display = 'block';
                } catch (e) {
                    alert('Kamera gagal diakses: ' + e.message);
                }
            }
        }

        function stopCamera() {
            const stream = webcamVideo.srcObject;
            if (stream) {
                const tracks = stream.getTracks();
                tracks.forEach(track => track.stop());
            }
            webcamVideo.style.display = 'none';
        }

        btnToggleAr.addEventListener('click', async () => {
            await requestSensors(); 

            if (!isArMode) {
                await startCamera();
                arView.style.display = 'block';
                btnToggleAr.innerText = "TUTUP VIDEO AR";
                btnToggleAr.style.background = "#ff4d4d";
                btnToggleAr.style.color = "#fff";
                isArMode = true;
            } else {
                stopCamera();
                arView.style.display = 'none';
                arrowLeft.style.display = 'none';
                arrowRight.style.display = 'none';
                btnToggleAr.innerText = "BUKA VIDEO AR";
                btnToggleAr.style.background = "#ffd700";
                btnToggleAr.style.color = "#000";
                isArMode = false;
            }
        });
    </script>
</body>
</html>
